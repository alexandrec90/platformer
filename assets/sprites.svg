<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Player Sprite (Pixel Art Style) -->
        <g id="player">
            <!-- Body/Outline -->
            <rect x="8" y="4" width="16" height="8" fill="#333" /> <!-- Hat Top -->
            <rect x="4" y="8" width="24" height="4" fill="#333" /> <!-- Hat Brim -->
            <rect x="8" y="12" width="16" height="8" fill="#ffccaa" /> <!-- Face -->
            <rect x="10" y="14" width="4" height="4" fill="#000" /> <!-- Eye L -->
            <rect x="20" y="14" width="4" height="4" fill="#000" /> <!-- Eye R -->
            <rect x="8" y="20" width="16" height="8" fill="#e74c3c" /> <!-- Shirt -->
            <rect x="8" y="28" width="6" height="4" fill="#3498db" /> <!-- Leg L -->
            <rect x="18" y="28" width="6" height="4" fill="#3498db" /> <!-- Leg R -->
        </g>
        
        <!-- Grass Platform (Pixel Art Style) -->
        <g id="grass">
            <!-- Dirt Base -->
            <rect x="0" y="0" width="32" height="32" fill="#8B4513" />
            <!-- Grass Top -->
            <rect x="0" y="0" width="32" height="8" fill="#2ecc71" />
            <rect x="0" y="8" width="4" height="4" fill="#2ecc71" />
            <rect x="8" y="8" width="4" height="4" fill="#2ecc71" />
            <rect x="16" y="8" width="4" height="4" fill="#2ecc71" />
            <rect x="24" y="8" width="4" height="4" fill="#2ecc71" />
            <!-- Dirt Details -->
            <rect x="4" y="16" width="4" height="4" fill="#654321" />
            <rect x="20" y="24" width="4" height="4" fill="#654321" />
        </g>
        
        <!-- Stone Platform (Pixel Art Style) -->
        <g id="stone">
            <rect x="0" y="0" width="32" height="32" fill="#7f8c8d" />
            <!-- Bricks Pattern -->
            <rect x="0" y="0" width="32" height="2" fill="#555" />
            <rect x="0" y="15" width="32" height="2" fill="#555" />
            <rect x="0" y="30" width="32" height="2" fill="#555" />
            <rect x="15" y="2" width="2" height="13" fill="#555" />
            <rect x="8" y="17" width="2" height="13" fill="#555" />
            <rect x="24" y="17" width="2" height="13" fill="#555" />
        </g>

        <!-- Enemy (Slime) -->
        <g id="slime">
            <rect x="4" y="12" width="24" height="20" fill="#9b59b6" />
            <rect x="8" y="8" width="16" height="4" fill="#9b59b6" />
            <!-- Eyes -->
            <rect x="8" y="16" width="6" height="6" fill="white" />
            <rect x="10" y="18" width="2" height="2" fill="black" />
            <rect x="18" y="16" width="6" height="6" fill="white" />
            <rect x="20" y="18" width="2" height="2" fill="black" />
            <!-- Shine -->
            <rect x="6" y="14" width="2" height="2" fill="#d2b4de" />
        </g>

        <!-- Coin -->
        <g id="coin">
            <rect x="8" y="4" width="16" height="24" fill="#f1c40f" />
            <rect x="4" y="8" width="24" height="16" fill="#f1c40f" />
            <!-- Shine/Detail -->
            <rect x="12" y="8" width="4" height="8" fill="#f39c12" />
        </g>

        <!-- Tree (Pixel Art Style) -->
        <g id="tree">
            <rect x="12" y="16" width="8" height="16" fill="#8B4513" /> <!-- Trunk -->
            <rect x="4" y="4" width="24" height="16" fill="#27ae60" /> <!-- Leaves Main -->
            <rect x="8" y="0" width="16" height="4" fill="#27ae60" /> <!-- Leaves Top -->
            <rect x="2" y="8" width="2" height="8" fill="#27ae60" /> <!-- Leaves Side L -->
            <rect x="28" y="8" width="2" height="8" fill="#27ae60" /> <!-- Leaves Side R -->
        </g>

        <!-- Cloud (Pixel Art Style) -->
        <g id="cloud">
            <rect x="8" y="12" width="16" height="12" fill="white" />
            <rect x="4" y="16" width="24" height="8" fill="white" />
            <rect x="12" y="8" width="8" height="4" fill="white" />
        </g>

        <!-- Dirt Platform (Pixel Art Style) -->
        <g id="dirt">
            <!-- Dirt Base -->
            <rect x="0" y="0" width="32" height="32" fill="#8B4513" />
            <!-- Dirt Details -->
            <rect x="4" y="4" width="4" height="4" fill="#654321" />
            <rect x="12" y="12" width="4" height="4" fill="#654321" />
            <rect x="24" y="8" width="4" height="4" fill="#654321" />
            <rect x="8" y="24" width="4" height="4" fill="#654321" />
            <rect x="20" y="20" width="4" height="4" fill="#654321" />
        </g>
    </defs>
</svg>