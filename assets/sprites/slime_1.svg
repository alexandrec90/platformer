<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Squished Body (Wider and Shorter) -->
    <rect x="2" y="14" width="28" height="18" fill="#9b59b6" />
    <rect x="6" y="10" width="20" height="4" fill="#9b59b6" />
    <!-- Eyes (Shifted down and out) -->
    <rect x="6" y="18" width="6" height="6" fill="white" />
    <rect x="8" y="20" width="2" height="2" fill="black" />
    <rect x="20" y="18" width="6" height="6" fill="white" />
    <rect x="22" y="20" width="2" height="2" fill="black" />
    <!-- Shine -->
    <rect x="4" y="16" width="2" height="2" fill="#d2b4de" />
</svg>