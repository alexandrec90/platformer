<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Trunk -->
    <rect x="12" y="16" width="8" height="16" fill="#8B4513" />
    <!-- Trunk Shadow (Right side) -->
    <rect x="18" y="16" width="2" height="16" fill="#654321" />
    
    <!-- Leaves Main Block -->
    <rect x="4" y="4" width="24" height="16" fill="#27ae60" />
    <!-- Leaves Top -->
    <rect x="8" y="0" width="16" height="4" fill="#27ae60" />
    <!-- Leaves Side L -->
    <rect x="2" y="8" width="2" height="8" fill="#27ae60" />
    <!-- Leaves Side R -->
    <rect x="28" y="8" width="2" height="8" fill="#27ae60" />

    <!-- Leaves Shadow (Bottom/Right) -->
    <rect x="4" y="18" width="24" height="2" fill="#1e8449" /> <!-- Bottom of main block -->
    <rect x="26" y="4" width="2" height="16" fill="#1e8449" /> <!-- Right of main block -->
    <rect x="28" y="14" width="2" height="2" fill="#1e8449" /> <!-- Bottom of Side R -->

    <!-- Leaves Highlight (Top/Left) -->
    <rect x="4" y="4" width="2" height="14" fill="#2ecc71" /> <!-- Left of main block -->
    <rect x="4" y="4" width="22" height="2" fill="#2ecc71" /> <!-- Top of main block -->
    <rect x="8" y="0" width="16" height="2" fill="#2ecc71" /> <!-- Top of top block -->
    <rect x="2" y="8" width="2" height="2" fill="#2ecc71" /> <!-- Top of Side L -->

    <!-- Details (Apples/Texture) -->
    <rect x="10" y="8" width="2" height="2" fill="#c0392b" /> <!-- Apple 1 -->
    <rect x="20" y="12" width="2" height="2" fill="#c0392b" /> <!-- Apple 2 -->
    <rect x="14" y="6" width="2" height="2" fill="#1e8449" /> <!-- Leaf texture -->

    <!-- Grass Base -->
    <rect x="10" y="28" width="2" height="4" fill="#2ecc71" />
    <rect x="12" y="30" width="2" height="2" fill="#2ecc71" />
    <rect x="18" y="29" width="2" height="3" fill="#2ecc71" />
    <rect x="20" y="28" width="2" height="4" fill="#2ecc71" />
</svg>