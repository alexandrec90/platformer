<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Base White -->
    <rect x="7" y="12" width="18" height="12" fill="white" /> <!-- Middle expanded left/right -->
    <rect x="4" y="16" width="24" height="8" fill="white" />
    <rect x="12" y="7" width="8" height="5" fill="white" /> <!-- Top expanded up -->
    
    <!-- Shadows (Bottom/Right) -->
    <rect x="4" y="22" width="24" height="2" fill="#dcdcdc" />
    <rect x="26" y="16" width="2" height="6" fill="#dcdcdc" />
    <rect x="23" y="12" width="2" height="4" fill="#dcdcdc" /> <!-- Right edge middle shifted -->
    <rect x="18" y="7" width="2" height="5" fill="#dcdcdc" />
    
    <!-- Subtle inner shading -->
    <rect x="8" y="20" width="16" height="2" fill="#f0f0f0" />
</svg>